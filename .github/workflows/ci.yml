name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci
      - run: docker pull postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
      - run: docker pull postgres:18-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
      - run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - run: npx playwright install --with-deps chromium
      - name: Full regression (keep failures)
        shell: bash
        env:
          BROWSER_REPORT_PATH: ${{ github.workspace }}/browser-results.json
        run: |
          set -o pipefail
          npm run check 2>&1 | tee engineering-check.log
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-check-${{ github.sha }}
          path: |
            engineering-check.log
            browser-results.json
          if-no-files-found: warn
          retention-days: 14
