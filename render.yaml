services:
  - type: web
    name: ai-agent-research-staging
    runtime: docker
    plan: standard
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEARCH_DATABASE_SCOPE
        value: isolated-staging
      - key: DATABASE_URL
        fromDatabase:
          name: ai-agent-research-staging-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADMIN_ACCESS_TOKEN
        generateValue: true
      - key: RESEARCH_BOOTSTRAP_SECRET
        generateValue: true
      - key: RESEARCH_BOOTSTRAP_BATCH
        value: B001
      - key: RESEARCH_BOOTSTRAP_COUNT
        value: '45'
      - key: DB_POOL_SIZE
        value: '10'
      - key: ADMIN_DEVELOPMENT_MODE
        value: 'true'
      - key: MODEL_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL_NAME
        value: deepseek-flash
      - key: MODEL_TEMPERATURE
        value: '0.2'
      - key: MODEL_MAX_TOKENS
        value: '512'
      - key: MODEL_TIMEOUT_MS
        value: '10000'
      - key: MODEL_MAX_ATTEMPTS
        value: '2'

databases:
  - name: ai-agent-research-staging-db
    plan: basic-1gb
    region: singapore
    databaseName: ai_agent_research
    user: research_admin
    ipAllowList: []
