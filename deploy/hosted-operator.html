<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>研究管理员：领取测试账号</title>
  </head>
  <body>
    <h1>领取内部测试账号</h1>
    <p>
      从 Render Secret 配置中私下取得 ADMIN_ACCESS_TOKEN，仅研究管理员使用。不要向参与者分发此凭据。
    </p>
    <form id="operator-form">
      <label
        >管理员访问凭据
        <input id="admin-token" type="password" required autocomplete="off" /></label
      ><button>读取固定测试账号</button>
    </form>
    <p id="operator-status" role="status"></p>
    <div id="operator-result"></div>
    <a href="/">进入参与者／管理员页面</a>
    <script src="/operator.js"></script>
  </body>
</html>
