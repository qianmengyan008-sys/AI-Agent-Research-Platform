# REVIEW ONLY: resource creation requires platform and budget approval.
# Infrastructure preparation only: no experiments, recruitment, or model calls.
services:
  - type: web
    name: ai-agent-research-production-preparation
    runtime: docker
    plan: standard
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerCommand: node --import tsx scripts/production-preparation.mjs
    healthCheckPath: /api/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEARCH_DATABASE_SCOPE
        value: isolated-production
      - key: RESEARCH_RECRUITMENT_ENABLED
        value: 'false'
      - key: PRODUCTION_DATABASE_NAME
        value: ai_agent_research_production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-agent-research-production-db
          property: connectionString
      - key: ADMIN_ACCESS_TOKEN
        generateValue: true
      - key: RESEARCH_BOOTSTRAP_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GPT_API_KEY
        sync: false
      - key: GPT_API_BASE_URL
        sync: false
      - key: GPT_MODEL_NAME
        sync: false
      - key: DEEPSEEK_API_BASE_URL
        sync: false
      - key: DEEPSEEK_MODEL_NAME
        sync: false

databases:
  - name: ai-agent-research-production-db
    plan: basic-1gb
    region: singapore
    databaseName: ai_agent_research_production
    user: production_research_admin
    ipAllowList: []
